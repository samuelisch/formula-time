services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: formula
      POSTGRES_PASSWORD: formula
      POSTGRES_DB: formula_time
    ports:
      - "5433:5432"   # 5433 on the host: a locally installed Postgres commonly owns 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formula -d formula_time"]
      interval: 2s
      timeout: 2s
      retries: 15
