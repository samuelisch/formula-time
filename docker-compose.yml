services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: formula
      POSTGRES_PASSWORD: formula
      POSTGRES_DB: formula_time
    ports:
      # DB_PORT (from scripts/db-env.sh, via db:up/db:down) defaults to 5433
      # for a plain checkout — a locally installed Postgres commonly owns
      # 5432 — and to a per-worktree port otherwise, so worktrees never share
      # a database.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formula -d formula_time"]
      interval: 2s
      timeout: 2s
      retries: 15
