<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormulaTime</title>
    <!-- vite.config.ts's build-meta plugin replaces this tag's content at
         build time with the platform's own commit variable; a release's
         smoke check reads it to confirm the served bundle is the released
         commit, not a stale one. Falls back to "unknown" rather than
         shipping this literal tag content unreplaced, e.g. local dev. -->
    <meta name="build" content="%VITE_GIT_SHA%" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
