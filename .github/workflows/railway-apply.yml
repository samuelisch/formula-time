name: Railway config apply

# Applies the plan pinned on the merge to release that last touched
# .railway/**. Re-plans nothing; fails if the environment or the merged
# tree drifted from what was planned (railwayapp/config's staleness check).
# release only carries commits fast-forwarded from main by the release
# skill, so this never fires on an ordinary merge to main.
on:
  push:
    branches: [release]
    paths:
      - ".railway/**"

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
