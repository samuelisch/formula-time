name: Railway config apply

# Applies the plan pinned on the merge to release that last touched
# .railway/**. Re-plans nothing; fails if the environment or the merged
# tree drifted from what was planned (railwayapp/config's staleness
# check). Runs on every push to release, not just ones that touch
# .railway/** -- a paths filter is evaluated against the branch's
# previous commit, so it never fires on a branch-creation push
# (formula-time #212) -- and the apply is idempotent, so a run with no
# .railway/** change is a no-op. workflow_dispatch lets the owner re-run
# it by hand.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
