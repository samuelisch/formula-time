name: Release

# A release is a fast-forward of `release` to a `main` commit (the
# `release` skill), never an ordinary merge. This workflow is the release
# gate: the exact same checks a PR already passed (reused from ci.yml, not
# copied), then a smoke job that waits for Railway and Netlify to finish
# deploying from this same push and confirms both actually serve traffic.
# A failed smoke job is red on the release commit; it does not roll
# anything back — that call is the owner's.
on:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  plan:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          comment: "false"
      - name: Fail if the released commit and the live environment disagree
        # command: plan only writes railway-plan.json; by design it does
        # not fail on a non-empty diff (it's meant to preview a PR's
        # change, not gate one). A non-empty plan here means the Railway
        # dashboard and .railway/railway.ts have drifted since the last
        # apply -- exactly what went unnoticed for three days (issue
        # #212) -- so the owner applies by hand or re-dispatches
        # railway-apply.yml (now on workflow_dispatch).
        run: |
          changes="$(jq '(.changeSet.changes // []) | length' railway-plan.json)"
          if [ "$changes" != "0" ]; then
            echo "railway config plan found $changes pending change(s): dashboard and .railway/railway.ts disagree" >&2
            jq -r '.diff // "no diff field"' railway-plan.json >&2
            exit 1
          fi
          echo "railway config plan: no changes, environment matches .railway/"

  smoke:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for the api to report the released build
        # The old build answering healthy is "not yet" (issue #212) -- a
        # release that never picks up the new SHA must be red. Two
        # consecutive matching reads, 30s apart, guard against a
        # mid-restart false positive.
        run: |
          api_url="https://api-production-8fbf2.up.railway.app/health"
          deadline=$((SECONDS + 1200))
          consecutive_ok=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(curl -s --max-time 10 "$api_url" || true)"
            build="$(echo "$body" | grep -o '"build":"[^"]*"' | cut -d'"' -f4)"
            echo "api build=$build released=$GITHUB_SHA"
            if [ "$build" = "$GITHUB_SHA" ]; then
              consecutive_ok=$((consecutive_ok + 1))
              if [ "$consecutive_ok" -ge 2 ]; then
                echo "api serving the released build on two consecutive reads"
                exit 0
              fi
              sleep 30
            else
              consecutive_ok=0
              sleep 10
            fi
          done
          echo "api never reported build=$GITHUB_SHA within 20 minutes" >&2
          exit 1

      - name: Confirm the Netlify bundle carries the released build
        run: |
          site_url="https://strong-marshmallow-9d4572.netlify.app/"
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(curl -s -o /tmp/site.html -w '%{http_code}' --max-time 10 "$site_url")"
            build="$(grep -o '<meta name="build" content="[^"]*"' /tmp/site.html | sed -E 's/.*content="([^"]*)"/\1/')"
            echo "site status=$status build=$build released=$GITHUB_SHA"
            if [ "$status" = "200" ] && [ "$build" = "$GITHUB_SHA" ]; then
              echo "netlify bundle serving the released build"
              exit 0
            fi
            sleep 15
          done
          echo "netlify bundle never reported build=$GITHUB_SHA within 20 minutes" >&2
          exit 1
