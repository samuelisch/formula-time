name: CI

# The proof that a PR passes the gate in ADR-0002: typecheck, unit,
# integration against a real Postgres, build, and no edit to an Accepted ADR.
# Agents and reviewers cite this check instead of running or pasting it.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only. On main every push is a distinct commit
  # that deserves its own recorded result; cancelling one leaves it unverified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: formula
          POSTGRES_PASSWORD: formula
          POSTGRES_DB: formula_time
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formula -d formula_time"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      # Same values docker-compose.yml gives locally, on the service's port.
      # One database plays both the pooled and the direct role here.
      DATABASE_URL: postgres://formula:formula@localhost:5432/formula_time
      DATABASE_DIRECT_URL: postgres://formula:formula@localhost:5432/formula_time

    steps:
      - uses: actions/checkout@v4
        with:
          # check-adr-immutable.sh diffs against origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Migrate the test database
        run: pnpm db:migrate:deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Accepted ADRs unchanged
        # On a PR the base is origin/main (the script's default). On a push
        # to main the checkout already is main, so the base must be the
        # tip before the push or the diff is empty by construction.
        env:
          ADR_CHECK_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: scripts/check-adr-immutable.sh
