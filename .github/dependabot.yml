version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Every specifier in this workspace is an exact version (AGENTS.md), so
    # a bump must rewrite the pin rather than widen it into a range.
    versioning-strategy: increase
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
